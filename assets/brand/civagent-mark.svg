<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CivAgent orbital gateway mark</title>
  <desc id="desc">A premium abstract crescent gateway mark with teal and amber energy edges.</desc>
  <defs>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) rotate(90) scale(430)">
      <stop offset="0" stop-color="#10231F"/>
      <stop offset="0.46" stop-color="#09100F"/>
      <stop offset="1" stop-color="#020403" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tealArc" x1="234" y1="204" x2="788" y2="832" gradientUnits="userSpaceOnUse">
